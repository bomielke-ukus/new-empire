[workspace]
resolver = "2"
members = [
    "crates/sim",
    "crates/view",
    "crates/render",
    "crates/app",
    "tools/simrunner",
    "tools/mapview",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# The floor the dependency tree actually imposes, not an aspiration: `image`
# (via tools/mapview) declares 1.88 and `wayland-protocols` (via winit)
# declares 1.86. The claim was 1.85 and nothing checked it until the MSRV job
# in CI. `crates/sim` on its own still needs only 1.85 — its whole normal
# dependency tree is serde — so that is the number that matters if the
# simulation is ever split out for a platform with an older toolchain.
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
ron = "0.10"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
# The sim is exercised for tens of thousands of ticks in tests; unoptimised
# fixed-point maths is painfully slow. Optimise dependencies and keep our own
# crates debuggable.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Reproducibility matters more than the last few percent of speed.
codegen-units = 1
lto = "thin"
debug = 1
