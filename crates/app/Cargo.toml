[package]
name = "new-empire"
description = "Brenden's Empires: the game binary."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "new-empire"
path = "src/main.rs"

[dependencies]
sim = { path = "../sim" }
fogged = { path = "../fogged" }
ai = { path = "../ai" }
save = { path = "../save" }
view = { path = "../view" }
audio = { path = "../audio" }
render = { path = "../render" }
winit = "0.30"
wgpu = "23"
pollster = "0.4"
# The device: mixing with a track per bus. `wav` reads the recordings that
# replace the placeholder sounds; no other decoder until there is something
# for it to decode.
kira = { version = "0.12.4", default-features = false, features = ["cpal", "wav"] }

# macOS 26 changed the Objective-C type encoding of `countByEnumeratingWithState:`
# from unsigned to signed. winit enumerates NSScreen through it at launch, and
# objc2's debug-build signature check then panics inside an AppKit callback,
# which aborts the process before the window exists. Upstream fixed it by
# turning on this feature (rust-windowing/winit#4302); until winit 0.30 ships
# with it, enable it here. Feature flags unify, so winit's objc2 gets it too.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5", features = ["relax-sign-encoding"] }
