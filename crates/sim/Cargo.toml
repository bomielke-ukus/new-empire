[package]
name = "sim"
description = "Deterministic simulation core. No rendering, no I/O, no floats, no clock."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The dependency list of this crate is policed by scripts/check-sim-purity.sh.
# Nothing may be added here that could make two machines disagree.
[dependencies]
serde = { workspace = true }

[dev-dependencies]
# Property testing. Dev-only, so it sits outside the dependency allowlist
# that scripts/check-sim-purity.sh enforces on the shipping tree.
proptest = "1"
# Round-tripping the on-disk replay format in tests.
ron = { workspace = true }
