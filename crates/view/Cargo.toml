[package]
name = "view"
description = "Presentation-side maths and data: projection, camera, palette, placeholder art, terrain mesh, scene building, minimap, and a software rasteriser that mirrors the GPU renderer."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sim = { path = "../sim" }
bytemuck = { workspace = true }
# Sprite sets: RON manifests beside indexed PNGs, straight from the art
# pipeline. `png` rather than `image` so the palette indices survive.
png = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }

ai-api = { path = "../ai-api" }

[dev-dependencies]
ai = { path = "../ai" }
