name: Mac build

# A double-clickable "New Empire.app" for testing on a Mac that has no
# toolchain: built on an Apple Silicon runner on every push to main and on
# demand, and attached to the run as an artifact for thirty days. The
# bundle is ad-hoc signed and not notarised, so the first launch of a
# downloaded copy goes through Gatekeeper; the README's "Testing a build
# on a Mac" says how.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# A newer push supersedes a build still running for the same branch.
concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: New Empire.app (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build and bundle
        run: scripts/bundle-mac.sh target/bundle
      - name: the bundle is what a Mac expects
        run: |
          app="target/bundle/New Empire.app"
          lipo -archs "$app/Contents/MacOS/new-empire" | tee /dev/stderr | grep -q arm64
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          test -f "target/bundle/New Empire.zip"
          ls -la target/bundle
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: New-Empire-macOS-${{ steps.sha.outputs.short }}
          path: target/bundle/New Empire.zip
          retention-days: 30
          if-no-files-found: error
